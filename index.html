<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14160f">
<title>弹道下坠速查</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one screen. Three pickers on top, the scope picture fills the rest. Page is dark on purpose (looking through glass); the scope image itself is fixed-colour. */
:root {
  --bg: #14160f;
  --panel: #1f221a;
  --ink: #e8e5d8;
  --muted: #9b9a88;
  --line: #3a3d31;
  --hold: #ff7a1a;
  --f-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { height: 100%; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.5;
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  padding-block: 10px 24px;
}
[hidden] { display: none !important; }
.wrap { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.wrap > * { min-width: 0; }
.pickers { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr) minmax(0, .8fr); gap: 6px; }
.pick { display: grid; gap: 2px; min-width: 0; }
.pick label { font-size: 11px; color: var(--muted); letter-spacing: .06em; }
select, input[type="number"] {
  font: inherit; font-size: 16px; font-weight: 700; color: var(--ink); background: var(--panel); border: 1px solid var(--line);
  padding: 8px 22px 8px 8px; width: 100%; min-width: 0; border-radius: 0; -webkit-appearance: none; appearance: none; text-overflow: ellipsis;
}
select { background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 12px) 55%, calc(100% - 7px) 55%; background-size: 5px 5px; background-repeat: no-repeat; }
input[type="number"] { font-family: var(--f-mono); padding-right: 8px; }
select:focus-visible, input:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--hold); outline-offset: 1px; }
.scope { position: relative; width: 100%; max-width: 100%; aspect-ratio: 1 / 1; }
.scope svg { display: block; width: 100%; height: 100%; }
.cap { font-size: 12px; color: var(--muted); text-align: center; margin: 0; }
.cap b { color: var(--hold); font-weight: 700; }
details { border-top: 1px solid var(--line); padding-top: 8px; }
summary { cursor: pointer; font-size: 13px; color: var(--muted); }
details[open] summary { margin-bottom: 10px; }
.set { display: grid; gap: 12px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
.field { display: grid; gap: 3px; min-width: 0; }
.field > label, .field > .lab { font-size: 12px; color: var(--muted); }
.hint { font-size: 12px; color: var(--muted); margin: 0; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--line); }
.seg button { font: inherit; font-size: 14px; font-weight: 700; padding: 7px 4px; border: 0; background: var(--panel); color: var(--ink); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.btn { font: inherit; font-size: 13px; color: var(--muted); background: transparent; border: 1px solid var(--line); padding: 5px 10px; cursor: pointer; justify-self: start; }
footer { font-size: 11px; color: var(--muted); line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">
  <div class="pickers">
    <div class="pick"><label for="gun">枪</label><select id="gun"></select></div>
    <div class="pick"><label for="ammo">弹药</label><select id="ammo"></select></div>
    <div class="pick"><label for="zero">归零</label><select id="zero"></select></div>
  </div>

  <div class="scope"><svg id="svg" viewBox="0 0 400 400" role="img" aria-label="瞄准镜分划与抬枪线"></svg></div>
  <p class="cap" id="cap"></p>

  <details>
    <summary>设置</summary>
    <div class="set">
      <div class="field">
        <label for="mult">刻度倍率（Tarkov 密位）</label>
        <input id="mult" type="number" inputmode="decimal" min="0.2" max="5" step="0.01">
        <p class="hint">游戏里的分划不是按真实比例画的，每个瞄具都不一样。倍率 = 游戏里 1 格刻度等于多少真实密位。1.00 就是真实密位。Tarkov Gunsmith 也是用这种倍率来修正。</p>
      </div>
      <div class="row">
        <div class="field">
          <span class="lab">瞄具高度</span>
          <div class="seg" role="group" aria-label="瞄具高度" data-key="sh">
            <button type="button" data-v="0.04">低</button>
            <button type="button" data-v="0.0686">中</button>
            <button type="button" data-v="0.09">高</button>
          </div>
        </div>
        <div class="field">
          <label for="vel">初速修正 %</label>
          <input id="vel" type="number" inputmode="decimal" step="0.1">
        </div>
      </div>
      <p class="hint">初速修正默认是这把枪出厂配置的数值（枪管、枪口装置）。换了枪管就把改装界面里的数值填进来。</p>
      <button type="button" class="btn" id="reset">恢复默认设置</button>
    </div>
  </details>

  <footer>算法与 Tarkov Gunsmith 相同：G1 阻力表、每 0.01 秒模拟一次。游戏的归零角度是按枪的默认弹药算的，换了弹药，归零距离上也会有偏差，图上已经算进去。只适用于水平射击。弹药和枪械数据来自 tarkov.dev，2026 年 10 月 31 日 快照。</footer>
</div>

<script>
// EFT ballistic model (as used by the game and Tarkov Gunsmith): G1 drag table indexed in 0.05 Mach steps,
// drag deceleration = Cd(v) * (1.2 * pi / 8) * 0.0014223 / BC * v^2, gravity 9.81, 0.01 s steps,
// position += v*dt + 5e-5*a, v += a*dt.
const G1 = [[0,.2629],[.05,.2558],[.1,.2487],[.15,.2413],[.2,.2344],[.25,.2278],[.3,.2214],[.35,.2155],[.4,.2104],[.45,.2061],[.5,.2032],[.55,.202],[.6,.2034],[.7,.2165],[.725,.223],[.75,.2313],[.775,.2417],[.8,.2546],[.825,.2706],[.85,.2901],[.875,.3136],[.9,.3415],[.925,.3734],[.95,.4084],[.975,.4448],[1,.4805],[1.025,.5136],[1.05,.5427],[1.075,.5677],[1.1,.5883],[1.125,.6053],[1.15,.6191],[1.2,.6393],[1.25,.6518],[1.3,.6589],[1.35,.6621],[1.4,.6625],[1.45,.6607],[1.5,.6573],[1.55,.6528],[1.6,.6474],[1.65,.6413],[1.7,.6347],[1.75,.628],[1.8,.621],[1.85,.6141],[1.9,.6072],[1.95,.6003],[2,.5934],[2.05,.5867],[2.1,.5804],[2.15,.5743],[2.2,.5685],[2.25,.563],[2.3,.5577],[2.35,.5527],[2.4,.5481],[2.45,.5438],[2.5,.5397],[2.6,.5325],[2.7,.5264],[2.8,.5211],[2.9,.5168],[3,.5133],[3.1,.5105],[3.2,.5084],[3.3,.5067],[3.4,.5054],[3.5,.504],[3.6,.503],[3.7,.5022],[3.8,.5016],[3.9,.501],[4,.5006],[4.2,.4998],[4.4,.4995],[4.6,.4992],[4.8,.499],[5,.4988]];
function cd(v) {
  const n = Math.floor(v / 343 / 0.05);
  if (n <= 0) return 0;
  if (n > G1.length - 1) return G1[G1.length - 1][1];
  const m1 = G1[n - 1][0] * 343, m2 = G1[n][0] * 343, b = G1[n - 1][1];
  return (G1[n][1] - b) / (m2 - m1) * (v - m1) + b;
}
const DT = 0.01, GRAV = 9.81, KDRAG = 1.2 * Math.PI / 8 * 0.0014223;
// Returns samples [x, y, t, v] for each step until x >= maxX (or 1500 steps).
function fly(v0, bc, angle, maxX) {
  const k = KDRAG / bc;
  let x = 0, y = 0, vx = v0 * Math.cos(angle), vy = v0 * Math.sin(angle), t = 0;
  const pts = [[0, 0, 0, v0]];
  for (let i = 0; i < 1500 && x < maxX; i++) {
    const v = Math.hypot(vx, vy);
    const a = cd(v) * k * v * v;
    const ax = -a * vx / v, ay = -GRAV - a * vy / v;
    x += vx * DT + 5e-5 * ax;
    y += vy * DT + 5e-5 * ay;
    vx += ax * DT; vy += ay * DT; t += DT;
    pts.push([x, y, t, Math.hypot(vx, vy)]);
  }
  return pts;
}
function at(pts, X) {
  for (let i = 1; i < pts.length; i++) {
    if (pts[i][0] >= X) {
      const p = pts[i - 1], q = pts[i], f = (X - p[0]) / (q[0] - p[0] || 1);
      return [X, p[1] + (q[1] - p[1]) * f, p[2] + (q[2] - p[2]) * f, p[3] + (q[3] - p[3]) * f];
    }
  }
  return null;
}
// Bore angle so the bullet crosses the line of sight (height h above bore, level) at zero distance Z.
function zeroAngle(v0, bc, Z, h) {
  let lo = -0.02, hi = 0.15;
  for (let i = 0; i < 50; i++) {
    const mid = (lo + hi) / 2;
    const p = at(fly(v0, bc, mid, Z + 1), Z);
    if (!p || p[1] < h) lo = mid; else hi = mid;
  }
  return (lo + hi) / 2;
}
function table(v0, bc, Z, h, dists) {
  const ang = zeroAngle(v0, bc, Z, h);
  const pts = fly(v0, bc, ang, Math.max(...dists) + 1);
  return { ang, rows: dists.map(d => { const p = at(pts, d); if (!p) return { d, ok: false }; const dy = p[1] - h; return { d, ok: true, dropCm: dy * 100, mil: -dy / d * 1000, tofMs: p[2] * 1000, v: p[3] }; }), pts };
}
if (typeof module !== "undefined") module.exports = { cd, fly, at, zeroAngle, table };

</script>

      let t = '<line x1="' + (C - 22) + '" x2="' + (C + 30) + '" y1="' + y + '" y2="' + y + '" stroke="' + col + '" stroke-width="3" stroke-linecap="round"/>';
      t += '<rect x="' + (C + 34) + '" y="' + (y - 10) + '" width="' + (label.length * 8.6 + 12) + '" height="20" rx="3" fill="#14160f" fill-opacity=".85"/>';
      t += '<text x="' + (C + 40) + '" y="' + (y + 5) + '" font-size="14" font-weight="600" font-family="IBM Plex Mono, monospace" fill="' + col + '">' + label + "</text>";
      return t;
    };
    kept.forEach(x => { s += line(x, x.mil > 0 ? "#ff6a00" : "#2f7fd6", x.d + "m"); });
    s += "</g>";
    $("svg").innerHTML = s;
  }

  $("gun").addEventListener("change", e => { state.gun = e.target.value; state.ammo = ""; state.vel = null; render(); });
  $("ammo").addEventListener("change", e => { state.ammo = e.target.value; render(); });
  $("zero").addEventListener("change", e => { state.zero = +e.target.value; render(); });
  $("mult").addEventListener("input", e => { const v = parseFloat(e.target.value); if (v >= 0.2 && v <= 5) { state.mult = v; render(); } });
  $("vel").addEventListener("input", e => { const v = parseFloat(e.target.value); if (!isNaN(v) && v > -90 && v < 200) { state.vel = v; render(); } });
  $("reset").addEventListener("click", () => { state.mult = 1; state.sh = DEF.sh; state.vel = null; render(); });
  document.querySelectorAll(".seg").forEach(sg => sg.addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; state[sg.dataset.key] = b.dataset.v; render(); }));
  render();
})();
</script>
</body>
</html>
